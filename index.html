/* ================================================================
   PFP / Pump Fun Pup — studio stylesheet
   ================================================================ */

:root {
  color-scheme: light;
  --paper: #FAF4E8;
  --paper-2: #F4EADA;
  --cream: #F1E4CE;
  --sand: #DDC4A0;
  --sand-deep: #C4A077;
  --caramel: #A8703F;
  --espresso: #2B1A11;
  --ink-2: #5E4634;
  --mandarin: #F26A1B;
  --mandarin-hi: #FF8740;
  --white: #FFFDF9;
  --print: #FEFEFE;

  --px: 0;
  --py: 0;

  --hdr: 64px;
  --ftr: 46px;
  --T: clamp(104px, min(25vh, 19vw), 290px);
  --P: clamp(240px, min(43vh, 31vw), 470px);
  --thumb: clamp(42px, 6.1vh, 62px);
  --gutter: clamp(16px, 3vw, 44px);

  --ease: cubic-bezier(.22, 1, .36, 1);
  --display: 'Rubik', 'Arial Rounded MT Bold', 'Helvetica Neue', Arial, sans-serif;
  --text: 'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif;
  --mono: ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;

  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
*, *::before, *::after { box-sizing: inherit; }

body {
  margin: 0;
  min-height: 100%;
  background: var(--paper);
  color: var(--espresso);
  font-family: var(--text);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}
img { max-width: 100%; }
button { font: inherit; color: inherit; }
button:not(:disabled) { cursor: pointer; }
p { margin: 0; }

.sr-only {
  position: absolute !important;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0);
  white-space: nowrap; border: 0;
}

:focus-visible { outline: 2.5px solid var(--espresso); outline-offset: 3px; }
main:focus, main:focus-visible { outline: none; }

/* ----------------------------------------------------------------
   Shell
   ---------------------------------------------------------------- */
.app {
  position: relative;
  min-height: 100vh;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  isolation: isolate;
  overflow-x: clip;
}
.app--empty { align-items: center; justify-content: center; padding: 40px; }

/* ----------------------------------------------------------------
   Background: studio sweep, drifting forms, avatar outlines
   ---------------------------------------------------------------- */
.bg {
  position: fixed;
  inset: 0;
  z-index: -1;
  overflow: hidden;
  pointer-events: none;
  background: linear-gradient(180deg, #FBF6EC 0%, #F9F1E4 50%, #F1E3CB 100%);
}
.bg-par {
  position: absolute;
  inset: -48px;
  transform: translate3d(calc(var(--px) * var(--d) * -1px), calc(var(--py) * var(--d) * -1px), 0);
}
.blob { position: absolute; border-radius: 50%; will-change: transform; }
.b1 {
  width: 72vmax; height: 72vmax; left: -24vmax; top: -34vmax;
  background: radial-gradient(closest-side, rgba(233, 208, 168, .85), rgba(233, 208, 168, 0));
  animation: blobA 38s ease-in-out infinite alternate;
}
.b2 {
  width: 62vmax; height: 62vmax; right: -24vmax; top: 4vh;
  background: radial-gradient(closest-side, rgba(247, 219, 190, .9), rgba(247, 219, 190, 0));
  animation: blobB 46s ease-in-out infinite alternate;
}
.b3 {
  width: 86vmax; height: 52vmax; left: 12vw; bottom: -30vmax;
  background: radial-gradient(closest-side, rgba(214, 180, 136, .5), rgba(214, 180, 136, 0));
  animation: blobC 54s ease-in-out infinite alternate;
}
@keyframes blobA { from { transform: translate3d(0, 0, 0) scale(1); } to { transform: translate3d(9vw, 7vh, 0) scale(1.08); } }
@keyframes blobB { from { transform: translate3d(0, 0, 0) scale(1.05); } to { transform: translate3d(-8vw, 10vh, 0) scale(.94); } }
@keyframes blobC { from { transform: translate3d(0, 0, 0) scale(1); } to { transform: translate3d(-10vw, -5vh, 0) scale(1.1); } }

/* the "table": horizon + soft cast shadow under the stage */
.bg-horizon {
  position: absolute; left: 0; right: 0; top: 56%; height: 44%;
  background: linear-gradient(180deg, rgba(222, 196, 158, 0) 0%, rgba(222, 196, 158, .32) 38%, rgba(214, 186, 146, .38) 100%);
}
.bg-table {
  position: absolute; left: 50%; top: 64%;
  width: 76vw; height: 34vh;
  transform: translate(-50%, -50%);
  background: radial-gradient(closest-side, rgba(43, 26, 17, .12), rgba(43, 26, 17, .04) 60%, rgba(43, 26, 17, 0));
}

.shape {
  position: absolute;
  transform: translate3d(calc(var(--px) * var(--sd) * -1px), calc(var(--py) * var(--sd) * -1px), 0);
}
.shape-in {
  position: absolute; inset: 0;
  border: 1.5px solid rgba(168, 112, 63, .26);
  animation: drift 30s ease-in-out infinite alternate;
}
.shape--ring .shape-in { border-radius: 50%; }
.shape--sq .shape-in { border-radius: 24%; }
.shape--ring:nth-child(3n) .shape-in { border-style: dashed; border-color: rgba(168, 112, 63, .22); }
@keyframes drift {
  0% { transform: translate3d(0, 0, 0) rotate(0deg); }
  50% { transform: translate3d(18px, -14px, 0) rotate(6deg); }
  100% { transform: translate3d(-12px, 10px, 0) rotate(-4deg); }
}

.bg-print { position: absolute; }
@media (max-width: 1179px) { .bg-print { display: none; } }
.bg-print-in {
  display: block; width: 100%; height: 100%;
  padding: 6%;
  background: var(--print);
  border-radius: 5px;
  opacity: .44;
  box-shadow: 0 1px 1px rgba(43, 26, 17, .06), 0 14px 30px -14px rgba(43, 26, 17, .35);
  animation: bob 16s ease-in-out infinite alternate;
}
.bg-print:nth-child(2) .bg-print-in { animation-duration: 19s; animation-delay: -6s; }
.bg-print:nth-child(3) .bg-print-in { animation-duration: 22s; animation-delay: -11s; }
.bg-print img { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 2px; }
@keyframes bob { from { transform: translate3d(0, 0, 0); } to { transform: translate3d(0, -14px, 0) rotate(2deg); } }

.grain {
  position: absolute; inset: 0;
  opacity: .07;
  mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .17 0 0 0 0 .1 0 0 0 0 .07 0 0 0 .9 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}

/* ambient motion switches */
html[data-motion="off"] .amb { animation: none !important; }
html[data-paused="true"] .amb { animation-play-state: paused !important; }

/* ----------------------------------------------------------------
   Header
   ---------------------------------------------------------------- */
.top {
  position: relative;
  z-index: 10;
  height: var(--hdr);
  display: flex;
  align-items: center;
  gap: clamp(12px, 2.4vw, 32px);
  padding: 0 var(--gutter);
}
.brand { display: flex; align-items: baseline; gap: 12px; margin-right: auto; min-width: 0; }
.brand-mark { font: 900 26px/1 var(--display); letter-spacing: -.02em; }
.brand-dot { color: var(--mandarin); }
.brand-name { font: 600 15px/1 var(--text); color: var(--ink-2); white-space: nowrap; }
.nav { display: flex; gap: 4px; }
.nav-link {
  position: relative;
  border: 0; background: none;
  padding: 10px 12px;
  font: 700 13px/1 var(--text);
  letter-spacing: .08em;
  border-radius: 10px;
}
.nav-link::after {
  content: '';
  position: absolute; left: 12px; right: 12px; bottom: 5px;
  height: 2px; border-radius: 2px;
  background: var(--mandarin);
  transform: scaleX(0); transform-origin: left center;
  transition: transform .35s var(--ease);
}
.nav-link:hover::after, .nav-link:focus-visible::after { transform: scaleX(1); }

.motion-btn {
  display: inline-flex; align-items: center; gap: 8px;
  border: 1.5px solid rgba(43, 26, 17, .18);
  background: rgba(255, 253, 249, .55);
  border-radius: 999px;
  padding: 6px 12px 6px 7px;
  font: 600 13px/1 var(--text);
  color: var(--ink-2);
  transition: border-color .2s, transform .15s var(--ease);
}
.motion-btn:hover { border-color: rgba(43, 26, 17, .4); }
.motion-btn:active { transform: scale(.96); }
.motion-sw {
  position: relative; width: 28px; height: 16px; border-radius: 999px;
  background: rgba(43, 26, 17, .18);
  transition: background-color .25s;
}
.motion-sw span {
  position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%;
  background: var(--white);
  box-shadow: 0 1px 2px rgba(43, 26, 17, .3);
  transition: transform .3s var(--ease);
}
.motion-btn[aria-pressed="true"] .motion-sw { background: var(--espresso); }
.motion-btn[aria-pressed="true"] .motion-sw span { transform: translateX(12px); }

/* ----------------------------------------------------------------
   Hero grid
   ---------------------------------------------------------------- */
.hero {
  position: relative;
  z-index: 2;
  flex: 1;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-areas: "title" "stage" "copy" "strip" "tools";
  justify-items: center;
  row-gap: 18px;
  padding: 6px var(--gutter) 24px;
}

/* ----------------------------------------------------------------
   3D title
   ---------------------------------------------------------------- */
.title { grid-area: title; margin: 0; position: relative; z-index: 1; font: inherit; line-height: 1; }
.wm {
  display: block;
  font-family: var(--display);
  font-weight: 900;
  font-size: var(--T);
  line-height: .74;
  letter-spacing: -.01em;
  perspective: 1200px;
  perspective-origin: 50% 40%;
  padding: .08em .08em .1em .04em;
  --step: calc(var(--T) * .15 / var(--n));
}
.wm-tilt {
  display: block;
  transform-style: preserve-3d;
  transform: rotateX(calc(9deg + var(--py) * -8deg)) rotateY(calc(-4deg + var(--px) * 14deg));
}
.wm-react { display: flex; gap: .065em; transform-style: preserve-3d; }
.L { display: block; position: relative; transform-style: preserve-3d; }
.L-float {
  display: block; position: relative; transform-style: preserve-3d;
  animation: float 7.5s ease-in-out infinite;
}
@keyframes float {
  0%, 100% { transform: translate3d(0, 0, 0) rotateZ(0deg); }
  50% { transform: translate3d(0, -.022em, 0) rotateZ(.7deg); }
}
.layer {
  position: absolute; inset: 0;
  display: block;
  transform: translateZ(0);
  transition: transform .95s var(--ease);
  transition-delay: calc(var(--i) * 16ms);
  backface-visibility: hidden;
}
.is-solid .layer { transform: translate3d(calc(var(--i) * var(--step) * .2), calc(var(--i) * var(--step) * .46), calc(var(--i) * var(--step) * -1)); }
.face {
  position: relative; display: block;
  color: #F6E6CB;
  background: linear-gradient(172deg, #FFFCF5 0%, #FBEFDB 34%, #F2DDBA 72%, #E8CB9E 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  -webkit-text-stroke: max(1px, .006em) rgba(150, 99, 58, .75);
  paint-order: stroke fill;
}

/* ----------------------------------------------------------------
   Stage + prints
   ---------------------------------------------------------------- */
.stage {
  grid-area: stage;
  position: relative;
  z-index: 3;
  width: var(--P);
  height: var(--P);
  margin-top: calc(var(--T) * -.15);
}
.stage-par {
  position: absolute; inset: 0;
  transform: translate3d(calc(var(--px) * -10px), calc(var(--py) * -8px), 0);
}
.print {
  display: block;
  margin: 0;
  background: var(--print);
  border-radius: 6px;
  box-shadow:
    0 1px 1px rgba(43, 26, 17, .07),
    0 12px 26px -14px rgba(43, 26, 17, .38),
    0 34px 60px -34px rgba(43, 26, 17, .38);
}
.frame { position: relative; display: block; width: 100%; aspect-ratio: 1 / 1; overflow: hidden; background: var(--print); border-radius: 3px; }
.frame-layer { position: absolute; inset: 0; }
.frame-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; user-select: none; -webkit-user-drag: none; }
.print--main { position: absolute; inset: 0; z-index: 3; padding: clamp(8px, 3%, 14px); }
.print--main .frame { height: 100%; aspect-ratio: auto; }
.print--sm { width: 100%; height: 100%; padding: 6%; }
.print--sm .frame { height: 100%; aspect-ratio: auto; }

.scatter {
  position: absolute;
  z-index: 1;
  left: calc(50% + var(--sx) * var(--P));
  top: calc(50% + var(--sy) * var(--P));
  width: calc(var(--sz) * var(--P));
  height: calc(var(--sz) * var(--P));
  margin-left: calc(var(--sz) * var(--P) * -.5);
  margin-top: calc(var(--sz) * var(--P) * -.5);
  border: 0; padding: 0; background: none;
  -webkit-tap-highlight-color: transparent;
}
.scatter.is-pile { z-index: 6; }

.tag {
  position: absolute;
  left: clamp(14px, 6%, 26px);
  bottom: -15px;
  z-index: 4;
  height: 30px;
  overflow: hidden;
  background: var(--espresso);
  color: var(--paper);
  border-radius: 8px;
  transform: rotate(-2.5deg);
  box-shadow: 0 6px 14px -6px rgba(43, 26, 17, .6);
}
.tag-in { display: block; padding: 0 12px; font: 700 13.5px/30px var(--text); letter-spacing: .02em; white-space: nowrap; }

/* ----------------------------------------------------------------
   Copy column
   ---------------------------------------------------------------- */
.copy { grid-area: copy; width: 100%; max-width: 420px; text-align: center; }
.mask { display: block; overflow: hidden; padding-bottom: .14em; margin-bottom: -.14em; }
.mask-in { display: block; }
.name { font: 800 clamp(20px, 1.7vw, 25px)/1.1 var(--display); letter-spacing: -.01em; color: var(--caramel); margin-bottom: 10px; }
.headline {
  margin: 0 0 14px;
  font: 800 clamp(38px, 3.9vw, 62px)/.96 var(--text);
  letter-spacing: -.035em;
}
.sub { font: 500 17px/1.45 var(--text); color: var(--ink-2); max-width: 26ch; margin: 0 auto 24px; }
.ctas { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-bottom: 22px; }

/* tactile buttons: a face that rides on an espresso edge */
.btn {
  position: relative;
  display: inline-block;
  border: 0;
  padding: 0;
  border-radius: 14px;
  background: var(--espresso);
  -webkit-tap-highlight-color: transparent;
}
.btn-face {
  display: inline-flex; align-items: center; justify-content: center; gap: 9px;
  min-height: 48px;
  padding: 0 20px;
  border: 2px solid var(--espresso);
  border-radius: 14px;
  background: var(--white);
  color: var(--espresso);
  font: 700 13.5px/1 var(--text);
  letter-spacing: .07em;
  white-space: nowrap;
  transform: translateY(-4px);
  transition: transform .18s var(--ease), background-color .2s;
}
.btn--primary .btn-face { background: var(--mandarin); }
.btn:hover .btn-face { transform: translateY(-6px); }
.btn--primary:hover .btn-face { background: var(--mandarin-hi); }
.btn:active .btn-face { transform: translateY(-1px); transition-duration: .05s; }
.btn:disabled .btn-face { opacity: .7; transform: translateY(-2px); }
.btn:focus-visible { outline-offset: 4px; }
.btn-ico { display: inline-flex; width: 18px; height: 18px; }
.btn-ico svg { width: 100%; height: 100%; }

/* X + CA */
.links { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: stretch; }
.chip {
  display: inline-flex; align-items: center; gap: 8px;
  min-height: 40px;
  padding: 0 14px;
  border-radius: 12px;
  border: 1.5px solid var(--espresso);
  background: var(--espresso);
  color: var(--paper);
  font: 700 14px/1 var(--text);
  text-decoration: none;
  transition: transform .18s var(--ease);
}
a.chip:hover { transform: translateY(-2px); }
a.chip:active { transform: translateY(1px); }
.chip-ico { display: inline-flex; width: 15px; height: 15px; }
.chip-ico svg { width: 100%; height: 100%; }
.chip.is-empty { background: transparent; color: var(--ink-2); border-style: dashed; border-color: rgba(43, 26, 17, .35); }
.ca {
  display: inline-flex; align-items: center; gap: 10px;
  min-height: 40px;
  max-width: 100%;
  padding: 4px 4px 4px 12px;
  border-radius: 12px;
  border: 1.5px solid rgba(43, 26, 17, .22);
  background: rgba(255, 253, 249, .75);
}
.ca.is-empty { border-style: dashed; padding-right: 14px; }
.ca-k { font: 800 12px/1 var(--display); letter-spacing: .06em; color: var(--caramel); }
.ca-v {
  font: 500 12.5px/1.35 var(--mono);
  color: var(--espresso);
  word-break: break-all;
  user-select: all;
  text-align: left;
}
.ca.is-empty .ca-v { font-family: var(--text); font-weight: 600; font-size: 14px; color: var(--ink-2); user-select: none; }
.ca-copy {
  flex: none;
  border: 0;
  border-radius: 9px;
  background: var(--espresso);
  color: var(--paper);
  padding: 8px 11px;
  font: 700 12.5px/1 var(--text);
  transition: transform .15s var(--ease);
}
.ca-copy:active { transform: scale(.95); }

/* ----------------------------------------------------------------
   Strip selector
   ---------------------------------------------------------------- */
.strip {
  grid-area: strip;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%;
  max-width: 980px;
}
.strip-nav {
  flex: none;
  width: 40px; height: 40px;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 50%;
  border: 1.5px solid rgba(43, 26, 17, .25);
  background: rgba(255, 253, 249, .8);
  color: var(--espresso);
  transition: transform .15s var(--ease), border-color .2s;
}
.strip-nav svg { width: 18px; height: 18px; }
.strip-nav:hover { border-color: var(--espresso); }
.strip-nav:active { transform: scale(.92); }
.track-wrap { position: relative; min-width: 0; flex: 0 1 auto; }
.track {
  position: relative;
  display: flex;
  gap: 10px;
  padding: 28px 12px 32px;
  overflow-x: auto;
  scroll-snap-type: x proximity;
  scrollbar-width: none;
  overscroll-behavior-x: contain;
}
.track::-webkit-scrollbar { display: none; }
.thumb {
  --y: 0px; --r: 0deg;
  position: relative;
  flex: none;
  width: var(--thumb);
  height: var(--thumb);
  padding: 3px;
  border: 0;
  border-radius: 10px;
  background: var(--print);
  scroll-snap-align: center;
  box-shadow: 0 1px 1px rgba(43, 26, 17, .08), 0 8px 16px -8px rgba(43, 26, 17, .45);
  transform: translate3d(0, var(--y), 0) rotate(var(--r));
  transition: transform .4s var(--ease), box-shadow .3s;
  -webkit-tap-highlight-color: transparent;
}
.thumb-frame { position: relative; display: block; width: 100%; height: 100%; overflow: hidden; border-radius: 7px; background: var(--print); }
.thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb:hover { transform: translate3d(0, calc(var(--y) - 6px), 0) rotate(var(--r)); }
.thumb:active { transform: translate3d(0, calc(var(--y) - 2px), 0) rotate(var(--r)) scale(.96); }
.thumb[aria-checked="true"] {
  z-index: 2;
  transform: translate3d(0, calc(var(--y) - 12px), 0) rotate(0deg) scale(1.12);
  box-shadow: 0 0 0 2px var(--paper), 0 0 0 4.5px var(--espresso), 0 14px 22px -10px rgba(43, 26, 17, .55);
}
.thumb:focus-visible { outline-offset: 6px; }
.ind {
  position: absolute; left: 0; top: 0;
  width: 22px; height: 5px;
  border-radius: 3px;
  background: var(--mandarin);
  opacity: 0;
  transition: transform .5s var(--ease), opacity .3s;
  pointer-events: none;
}
.ind.is-ready { opacity: 1; }

/* ----------------------------------------------------------------
   Tools: preview + download
   ---------------------------------------------------------------- */
.tools {
  grid-area: tools;
  width: 100%;
  max-width: 420px;
  padding: 18px 18px 16px;
  background: rgba(255, 253, 249, .82);
  border: 1px solid rgba(43, 26, 17, .1);
  border-radius: 20px;
  box-shadow: 0 1px 0 rgba(255, 255, 255, .8) inset, 0 20px 40px -26px rgba(43, 26, 17, .4);
}
.tools-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.tools-h { margin: 0; font: 700 15px/1.2 var(--text); }
.seg {
  position: relative;
  display: inline-grid;
  grid-template-columns: 1fr 1fr;
  padding: 3px;
  border-radius: 11px;
  background: var(--cream);
}
.seg-thumb {
  position: absolute; top: 3px; left: 3px; bottom: 3px;
  width: calc(50% - 3px);
  border-radius: 8px;
  background: var(--espresso);
  transition: transform .38s var(--ease);
}
.seg[data-shape="circle"] .seg-thumb { transform: translateX(100%); }
.seg-opt {
  position: relative; z-index: 1;
  border: 0; background: none;
  padding: 8px 11px;
  font: 700 11.5px/1 var(--text);
  letter-spacing: .07em;
  color: var(--ink-2);
  border-radius: 8px;
  transition: color .3s;
}
.seg-opt[aria-checked="true"] { color: var(--paper); }

.avatars { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 12px; }
.av {
  flex: none;
  display: block;
  overflow: hidden;
  background: var(--print);
  border-radius: 12%;
  box-shadow: 0 0 0 1px rgba(43, 26, 17, .1), 0 10px 22px -12px rgba(43, 26, 17, .45);
  transition: border-radius .45s var(--ease);
}
.av img { display: block; width: 100%; height: 100%; object-fit: cover; }
.av--lg { width: 116px; height: 116px; }
.av--md { width: 56px; height: 56px; }
.av--sm { width: 34px; height: 34px; }
.avatars.is-circle .av { border-radius: 50%; }
.note { font-size: 13px; line-height: 1.4; color: var(--ink-2); margin-bottom: 12px; }
.file { margin: 0 0 14px; display: grid; gap: 4px; font-size: 13px; line-height: 1.35; }
.file > div { display: grid; grid-template-columns: 56px 1fr; gap: 8px; }
.file dt { color: var(--ink-2); }
.file dd { margin: 0; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.tools-actions { min-height: 60px; }
.acts { display: grid; grid-template-columns: 1fr; gap: 10px; }
.acts .btn, .acts .btn-face { width: 100%; }
@media (max-width: 1179px) { .acts { grid-template-columns: 1.4fr 1fr; } .acts .btn-face { padding: 0 12px; } }
.hint { font: 600 14.5px/1.4 var(--text); padding: 12px 14px; border-radius: 12px; background: var(--cream); color: var(--ink-2); }
.dl-status { font-size: 13.5px; line-height: 1.4; min-height: 1.4em; margin-top: 10px; color: var(--ink-2); }
.dl-status.is-done { color: var(--espresso); font-weight: 600; }
.dl-status.is-blocked { color: var(--espresso); }
.link {
  border: 0; background: none; padding: 0;
  font: 700 inherit/inherit var(--text);
  font-size: inherit;
  color: var(--espresso);
  text-decoration: underline;
  text-decoration-thickness: 2px;
  text-underline-offset: 3px;
  text-decoration-color: var(--mandarin);
}
.link:hover { text-decoration-color: var(--espresso); }

/* ----------------------------------------------------------------
   Footer
   ---------------------------------------------------------------- */
.foot {
  position: relative;
  z-index: 3;
  min-height: var(--ftr);
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 0 var(--gutter);
  font: 600 14px/1.3 var(--text);
  color: var(--ink-2);
}
.foot-link { display: inline-flex; align-items: center; gap: 6px; color: var(--espresso); font-weight: 700; text-decoration: none; }
.foot-link:hover { text-decoration: underline; }
.foot-ico { display: inline-flex; width: 14px; height: 14px; }
.foot-ico svg { width: 100%; height: 100%; }

/* ----------------------------------------------------------------
   Intro skip
   ---------------------------------------------------------------- */
.skip {
  position: fixed;
  right: max(18px, env(safe-area-inset-right, 0px));
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  z-index: 80;
  border: 1.5px solid var(--espresso);
  background: var(--white);
  color: var(--espresso);
  border-radius: 999px;
  padding: 11px 18px;
  font: 700 13.5px/1 var(--text);
  box-shadow: 0 10px 24px -12px rgba(43, 26, 17, .5);
}
.skip:hover { background: var(--cream); }

/* ----------------------------------------------------------------
   Panels
   ---------------------------------------------------------------- */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(43, 26, 17, .42); }
.sheet {
  position: fixed;
  z-index: 51;
  background: var(--paper);
  color: var(--espresso);
  display: flex;
  flex-direction: column;
  box-shadow: 0 40px 90px -30px rgba(43, 26, 17, .6);
}
.sheet:focus { outline: none; }
.sheet-bar {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
  padding: calc(18px + env(safe-area-inset-top, 0px)) 22px 16px;
  border-bottom: 1px solid rgba(43, 26, 17, .1);
  background: var(--paper);
}
.sheet-bar--sticky { position: sticky; top: 0; z-index: 2; }
.sheet-title { margin: 0; font: 900 clamp(28px, 3vw, 40px)/1 var(--display); letter-spacing: -.01em; }
.sheet-title--sm { font-size: 20px; overflow-wrap: anywhere; }
.sheet-sub { margin-top: 6px; font-size: 14.5px; color: var(--ink-2); }
.close {
  flex: none;
  display: inline-flex; align-items: center; gap: 6px;
  border: 1.5px solid var(--espresso);
  background: var(--white);
  border-radius: 999px;
  padding: 9px 14px 9px 11px;
  font: 700 13.5px/1 var(--text);
  transition: transform .15s var(--ease), background-color .2s;
}
.close:hover { background: var(--cream); }
.close:active { transform: scale(.95); }
.close-ico { display: inline-flex; width: 16px; height: 16px; }
.close-ico svg { width: 100%; height: 100%; }

/* gallery */
.sheet--gallery { inset: 3.5vh 3.5vw; border-radius: 24px; overflow: hidden; }
.sheet--gallery .sheet-bar { padding-top: 20px; }
.sheet-body { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 26px 24px 40px; }
.grid {
  list-style: none; margin: 0; padding: 0;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(210px, 42vw), 1fr));
  gap: clamp(14px, 2vw, 26px);
}
.card {
  display: block; width: 100%;
  border: 0; padding: 0; background: none; text-align: left;
  -webkit-tap-highlight-color: transparent;
}
.card-print {
  display: block;
  aspect-ratio: 1 / 1;
  padding: 5%;
  background: var(--print);
  border-radius: 8px;
  box-shadow: 0 1px 1px rgba(43, 26, 17, .07), 0 14px 26px -16px rgba(43, 26, 17, .45);
  transition: transform .35s var(--ease), box-shadow .35s var(--ease);
}
.card-print img { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 3px; }
.card:hover .card-print { transform: translateY(-6px) rotate(-.8deg); box-shadow: 0 1px 1px rgba(43, 26, 17, .07), 0 24px 34px -18px rgba(43, 26, 17, .5); }
.card:active .card-print { transform: translateY(-1px) scale(.98); }
.card.is-cur .card-print { box-shadow: 0 0 0 2px var(--paper), 0 0 0 4.5px var(--espresso), 0 14px 26px -16px rgba(43, 26, 17, .45); }
.card-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 2px 0; }
.card-label { font: 700 14.5px/1.2 var(--text); }
.card-cur { font: 700 12px/1 var(--text); background: var(--mandarin); color: var(--espresso); padding: 5px 8px; border-radius: 6px; }
.card:focus-visible { outline: none; }
.card:focus-visible .card-print { outline: 2.5px solid var(--espresso); outline-offset: 4px; }

/* idea */
.sheet--idea { top: 0; right: 0; bottom: 0; width: min(660px, 100vw); overflow-y: auto; overscroll-behavior: contain; display: block; }
.idea-banner { margin: 0; padding: 22px 22px 0; }
.idea-banner img { display: block; width: 100%; height: auto; aspect-ratio: 3 / 1; object-fit: cover; border-radius: 10px; background: var(--print); box-shadow: 0 16px 30px -20px rgba(43, 26, 17, .5); }
.idea-banner figcaption { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 10px; font-size: 13.5px; color: var(--ink-2); }
.idea-dl:empty { display: none; }
.idea {
  padding: 30px 22px 10px;
  max-width: 34em;
  font: 400 18.5px/1.62 var(--text);
}
.idea p { margin: 0 0 1em; }
.idea-big {
  font: 900 clamp(46px, 7vw, 76px)/.95 var(--display) !important;
  letter-spacing: -.02em;
  color: var(--espresso);
  margin: .5em 0 .45em !important;
}
.idea-big--stack span { display: block; }
.idea-big--stack span:nth-child(2) { color: var(--caramel); }
.idea-big--stack span:nth-child(3) { color: var(--mandarin); -webkit-text-stroke: max(1px, .012em) var(--espresso); paint-order: stroke fill; }
.idea-list { display: flex; flex-direction: column; gap: 2px; padding-left: 16px; border-left: 3px solid var(--sand); font-weight: 600; color: var(--ink-2); }
.idea-mark {
  display: inline-block;
  font: 800 clamp(24px, 3.2vw, 32px)/1.15 var(--text);
  letter-spacing: -.02em;
  padding: .18em .4em;
  margin: .4em 0 1em !important;
  background: var(--espresso);
  color: var(--paper);
  border-radius: 10px;
  transform: rotate(-1.2deg);
}
.idea-end { display: flex; flex-wrap: wrap; align-items: center; gap: 16px 20px; padding: 16px 22px calc(40px + env(safe-area-inset-bottom, 0px)); }
.fine { font-size: 13px; color: var(--ink-2); }

/* original viewer */
.sheet--original { inset: 4vh 4vw; border-radius: 22px; overflow: hidden; }
.sheet--original .sheet-bar { padding-top: 18px; }
.orig-body { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 20px; overflow: auto; }
.orig-body img { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; border-radius: 6px; background: var(--print); box-shadow: 0 20px 40px -24px rgba(43, 26, 17, .5); }

/* flying copy from gallery to stage */
.flight { position: fixed; z-index: 70; object-fit: cover; pointer-events: none; border-radius: 3px; }

/* ----------------------------------------------------------------
   Tablet: two columns under the stage
   ---------------------------------------------------------------- */
@media (min-width: 760px) and (max-width: 1179px) {
  :root { --T: clamp(120px, 20vw, 220px); --P: clamp(300px, 52vw, 460px); }
  .hero {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    grid-template-areas: "title title" "stage stage" "strip strip" "copy tools";
    column-gap: 32px;
    row-gap: 22px;
    align-items: start;
  }
  .copy { text-align: left; justify-self: end; }
  .sub { margin-left: 0; }
  .ctas, .links { justify-content: flex-start; }
  .tools { justify-self: start; }
}

/* ----------------------------------------------------------------
   Desktop: one-viewport studio
   ---------------------------------------------------------------- */
@media (min-width: 1180px) {
  .hero {
    grid-template-columns: minmax(0, 1fr) var(--P) minmax(0, 1fr);
    grid-template-rows: auto auto auto;
    grid-template-areas:
      "copy  title tools"
      "copy  stage tools"
      "strip strip strip";
    column-gap: clamp(56px, 8vw, 150px);
    row-gap: 6px;
    align-content: center;
    align-items: center;
    min-height: calc(100svh - var(--hdr) - var(--ftr) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    padding-top: 0;
    padding-bottom: 4px;
  }
  .copy { justify-self: start; text-align: left; max-width: 380px; align-self: center; }
  .sub { margin-left: 0; }
  .ctas, .links { justify-content: flex-start; }
  .tools { justify-self: end; max-width: 312px; align-self: center; }
  .strip { margin-top: 4px; }
  .track { overflow: visible; padding: 16px 8px 34px; }
}

/* short desktop screens */
@media (min-width: 1180px) and (max-height: 760px) {
  :root { --hdr: 56px; --ftr: 38px; --T: clamp(96px, min(23vh, 17vw), 260px); --P: clamp(230px, min(41vh, 30vw), 440px); }
  .headline { font-size: clamp(34px, 3.4vw, 52px); }
  .sub { margin-bottom: 18px; }
  .note { display: none; }
  .avatars { margin-bottom: 10px; }
  .av--lg { width: 96px; height: 96px; }
}

/* ----------------------------------------------------------------
   Mobile
   ---------------------------------------------------------------- */
@media (max-width: 759px) {
  :root { --hdr: 58px; --T: min(31vw, 168px); --P: min(76vw, 380px); --thumb: 56px; }
  .top { gap: 8px; }
  .brand-name { display: none; }
  .nav-link { padding: 10px 8px; font-size: 12px; letter-spacing: .06em; }
  .nav-link::after { left: 8px; right: 8px; }
  .motion-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .motion-btn { padding: 7px; }
  .hero { row-gap: 22px; padding-bottom: 30px; }
  .stage { margin-top: calc(var(--T) * -.16); margin-bottom: 8px; }
  .copy { margin-top: 6px; }
  .strip { gap: 6px; }
  .track { padding: 26px 10px 30px; }
  .tools { padding: 16px; }
  .foot { flex-direction: column; justify-content: center; padding-top: 10px; padding-bottom: 16px; }
  .sheet--gallery { inset: 0; border-radius: 0; }
  .sheet--gallery .sheet-bar { padding-top: calc(16px + env(safe-area-inset-top, 0px)); }
  .sheet-body { padding: 18px 16px calc(32px + env(safe-area-inset-bottom, 0px)); }
  .sheet--idea { width: 100vw; top: 0; }
  .sheet--original { inset: 0; border-radius: 0; }
  .idea { font-size: 17.5px; }
}
@media (max-width: 380px) {
  .nav-link { font-size: 11px; padding: 10px 6px; }
  .brand-mark { font-size: 22px; }
  .btn-face { padding: 0 15px; }
}

/* ----------------------------------------------------------------
   Reduced motion: keep feedback, drop travel
   ---------------------------------------------------------------- */
@media (prefers-reduced-motion: reduce) {
  .amb { animation: none !important; }
  .layer { transition: none; }
  .thumb, .btn-face, .ind, .card-print, .av, .seg-thumb, .nav-link::after { transition-duration: .01ms !important; }
  .wm-tilt { transform: rotateX(9deg) rotateY(-4deg); }
  .bg-par, .shape, .stage-par { transform: none; }
}
